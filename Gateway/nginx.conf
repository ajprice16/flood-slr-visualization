# Resolve real client IPs from trusted reverse proxies (Caddy / container network).
# This avoids all conference users being treated as one IP when traffic arrives
# through an edge proxy hop.
real_ip_header X-Forwarded-For;
real_ip_recursive on;
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

# Per-IP limits tuned for conference/shared-NAT traffic.
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=120r/s;
limit_req_zone $binary_remote_addr zone=analysis_rate:10m rate=12r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Disk-backed cache for rendered PNG tiles to absorb repeat traffic.
# /tmp is writable in nginx-unprivileged images across environments.
proxy_cache_path /tmp/nginx_tile_cache levels=1:2 keys_zone=tile_cache:200m max_size=12g inactive=24h use_temp_path=off;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;
  limit_conn conn_per_ip 300;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https: http:; font-src 'self' data: https:; worker-src blob:; frame-ancestors 'none';" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Tighter rate limit for expensive analysis endpoint
  location /api/analyze_region {
    limit_req zone=analysis_rate burst=60 nodelay;
    limit_except GET HEAD OPTIONS { deny all; }
    resolver 127.0.0.11 ipv6=off;
    proxy_pass http://backend:8000/analyze_region;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
  }

  # Cache tile responses at the gateway to avoid repeated backend renders.
  location /api/tiles/ {
    limit_req zone=api_rate burst=600 nodelay;
    limit_except GET HEAD OPTIONS { deny all; }
    resolver 127.0.0.11 ipv6=off;
    proxy_pass http://backend:8000/tiles/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    proxy_cache tile_cache;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$scheme$proxy_host$request_uri";
    proxy_cache_valid 200 1h;
    proxy_ignore_headers Set-Cookie;
    # Nginx add_header in a location block does not inherit server-block headers,
    # so security headers must be repeated here alongside X-Proxy-Cache.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https: http:; font-src 'self' data: https:; worker-src blob:; frame-ancestors 'none';" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Proxy-Cache $upstream_cache_status always;
  }

  # Proxy API to FastAPI backend
  location /api/ {
    limit_req zone=api_rate burst=240 nodelay;
    limit_except GET HEAD OPTIONS { deny all; }
    resolver 127.0.0.11 ipv6=off;
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # Block dev-only source paths to avoid SPA fallback returning HTML
  # This prevents MIME type mismatch when the page tries to load /src/*.jsx
  location ^~ /src/ {
    return 404;
  }

  # Ensure built assets are proxied directly to frontend static handler
  location ^~ /assets/ {
    resolver 127.0.0.11 ipv6=off;
    set $frontend_upstream frontend:8080;
    proxy_pass http://$frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # Everything else to the frontend (already serving SPA)
  location / {
    resolver 127.0.0.11 ipv6=off;
    # Avoid path rewrite loops: no trailing slash on proxy_pass
    set $frontend_upstream frontend:8080;
    proxy_pass http://$frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
